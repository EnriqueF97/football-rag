# GDELT ingest configuration — football/soccer news.
#
# THE DOMAIN LIVES HERE. To retarget the whole project (F1, cybersecurity, ...) you
# edit this one file — no code changes. `queries` is the search net; `date_range` and
# `gdelt` control the window and politeness.
#
# GDELT note: multiple words in a query are matched with AND (all must appear). So
# "football transfer" = articles containing both words. Competition names (Premier
# League, La Liga, ...) are strong anchors on their own; topic queries are anchored
# with "football"/"soccer" to avoid pulling in other sports and US-football noise.
# Edit freely — you are the domain expert here.

# PILOT WINDOW — one month, to calibrate the allowlist / dedup threshold / validity
# rules on real data before committing to the full ~5h run. Widen to
# start 2024-08-01 / end 2026-06-30 (two seasons) once the pilot's `corpus stats` looks
# sane. Note: August is peak transfer-window season — good saga material.
date_range:
  start: "2024-08-01"
  end: "2026-06-30"

# Guardian Open Platform (guardian.py). The reliable-tier anchor: official API, full
# bodies, legal. Set GUARDIAN_API_KEY in the environment (free key, 500 calls/day —
# the whole two-season backfill fits in ~130 calls).
guardian:
  section: football
  page_size: 50 # API max per call
  sleep_seconds: 1 # free tier allows 1 request/second

gdelt:
  max_records: 250 # GDELT caps a single request at 250 articles
  # Cooldown between requests. GDELT throttled us at 12s (two 429s in the first minutes
  # of a real run), so this is 20. The code now retries 429/5xx with exponential backoff,
  # but a larger sleep avoids burning time in retries. Lower it at your own risk.
  sleep_seconds: 20
  language: "English" # keep only this GDELT language

queries:
  # --- Competitions (strong, unambiguous anchors) ---
  - "Premier League"
  - "Eredivisie"
  - "La Liga"
  - "Serie A"
  - "Bundesliga"
  - "Ligue 1"
  - "Champions League"

  # --- Text-native topics (the RAG-valuable stories) ---
  - "football transfer"
  - "transfer rumour football"
  - "football manager sacked"
  - "football coach appointed"
  - "football injury"
  - "football takeover"
  - "soccer transfer" # US sources say "soccer"; catches ESPN etc.

  # --- Optional: uncomment to bias the corpus toward specific saga-heavy clubs ---
  # - "Real Madrid"
  # - "Manchester United"
  # - "Barcelona football"

# --- Source allowlist (used by gdelt.py at ingest) -----------------------------------
# Only these domains enter the corpus. GDELT indexes ALL news, which means general-news
# aggregators that merely republish wire copy (and outright off-topic noise — a TV guide
# turned up in the very first smoke run). Restricting to real football journalism raises
# corpus quality and cuts the syndication problem at its source.
#
# It does NOT replace dedup: several outlets covering the same transfer saga is exactly
# the conflicting-sources material this project needs — we just want them to be good
# outlets. Never narrow this to a single source; that would kill the sagas.
#
# Matching is suffix-based and www-insensitive: `bbc.co.uk` also matches
# `sport.bbc.co.uk`. Set `enabled: false` to ingest everything — useful for one run, to
# see the real domain distribution via `corpus stats` before curating this list.
#
# Hard-paywalled sites (The Athletic, The Times) are deliberately absent: they yield
# paywall stubs, not bodies. Edit freely — you are the domain expert.
sources:
  enabled: true
  allowlist:
    # --- UK football desks ---
    - bbc.com
    - bbc.co.uk
    - theguardian.com
    - skysports.com
    - independent.co.uk
    - mirror.co.uk
    - standard.co.uk
    - football365.com
    - fourfourtwo.com
    - 90min.com
    - givemesport.com
    - thisisanfield.com
    # --- Global ---
    - espn.com
    - espn.co.uk
    - goal.com
    - eurosport.com
    - si.com
    - cbssports.com
    # --- Continental Europe (English editions) ---
    - marca.com
    - as.com
    - football-italia.net
    - bundesliga.com
    # --- Official ---
    - premierleague.com
    - uefa.com
    - fifa.com

# --- Common Crawl discovery (used by cc.py — the tabloid tier) -----------------------
# Only domains VERIFIED present in Common Crawl (the reliable tier — Guardian, BBC,
# Sky, ESPN, GiveMeSport — blocks CCBot and is NOT here; Guardian arrives via its API).
# Patterns are CDX prefix queries: no scheme, no www (SURT canonicalization ignores
# both). General-news outlets are pinned to their football path; dedicated football
# sites take the whole domain.
commoncrawl:
  first_crawl: "CC-MAIN-2024-33" # first monthly crawl covering date_range.start
  sleep_seconds: 4 # pause between CDX queries (the index 502/504s under load)
  max_per_pattern_per_crawl: 250 # volume knob: keeps the tabloid tier balanced
  url_patterns:
    - "mirror.co.uk/sport/football/*"
    - "independent.co.uk/sport/football/*"
    - "90min.com/*"
    - "teamtalk.com/*"
    - "caughtoffside.com/*"
    - "fourfourtwo.com/*"
    - "thisisanfield.com/*"
    - "football365.com/*"

# --- Media Cloud discovery (used by mediacloud_ingest.py — reliable tier) ------------
# The reliable outlets Common Crawl can't reach (they block CCBot) but that fetch fine
# directly. Media Cloud's Online News Archive discovers their in-window URLs; bodies come
# from the normal fetch+extract. `query` is a full-text football filter (these sites are
# multi-sport); the extract.py validity filter removes any non-football residue.
mediacloud:
  sources:
    - bbc.co.uk
    - skysports.com
    - espn.com
  query: 'football OR soccer OR "premier league" OR "champions league"'
  page_size: 1000
  # Cap per source per month. BBC alone yields ~1500/month — unbounded it would become
  # the new >40% over-represented domain, just swapping Guardian's problem for BBC's.
  # ~500 keeps each reliable source in the same ballpark as Guardian (~460/month) so the
  # tier is balanced. A knob: raise it if a source is under-represented after `stats`.
  max_per_month: 500

# --- Body validity filter (used by extract.py) --------------------------------------
# Decides whether an extracted body is a usable football article or junk (nav chrome,
# paywall stub, block page, off-topic GDELT noise like a TV listing). Tune freely.
validity:
  min_chars: 400 # shorter than this is a stub, not an article
  min_keyword_hits: 2 # how many DISTINCT keywords below must appear (2 avoids a passing mention)

  # Football signal. A real match report / transfer story hits several of these.
  keywords:
    - football
    - soccer
    - club
    - league
    - match
    - goal
    - player
    - squad
    - manager
    - coach
    - transfer
    - signing
    - striker
    - midfielder
    - defender
    - goalkeeper
    - season
    - fixture
    - injury
    - contract
    - stadium
    - penalty
    - substitute
    - sacked

  # High-precision markers of a NON-article page. Kept short on purpose: an
  # over-eager list silently drops good articles, which is worse than a little noise.
  spam_phrases:
    - "enable javascript"
    - "accept all cookies"
    - "subscribe to continue"
    - "your browser is not supported"
    - "access denied"
    - "are you a robot"
